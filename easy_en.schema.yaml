# Rime schema
# encoding: utf-8
---

schema:
  schema_id: easy_en
  name: Easy English
  version: 2026.01.23
  author:
    - Boomker <gmboomker@gmail.com>
  description: Easy English

menu:
  page_size: 5

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - recognizer
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
    - punct_translator
    - lua_translator@*word_autocaps*translator
  filters:
    - lua_filter@*word_autocaps*filter
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA-_'
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " "

translator:
  dictionary: easy_en
  spelling_hints: 0
  enable_encoder: false
  enable_sentence: false
  enable_user_dict: false
  enable_completion: true
