# Rime schema settings
# encoding: utf-8

schema:
  schema_id: flypy_places
  name: 小鹤地名
  version: "1.0"

switches:
  - name: ascii_mode
    reset: 0
    states: [ CN, EN ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ;']`"
  initials: ";abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  finals: ''
  max_code_length: 4
  auto_select: true
  auto_select_pattern: ^;.$|^\w{4}$

translator:
  dictionary: flypy.places
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
